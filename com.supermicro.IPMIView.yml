---
id: com.supermicro.IPMIView
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk

command: /app/IPMIView/IPMIView-starter
finish-args:
  - --share=ipc
  - --device=dri
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --env=JAVA_TOOL_OPTIONS="-Dawt.useSystemAAFontSettings=on"
  - --persist=IPMIView

modules:
  - name: IPMIView
    buildsystem: simple
    build-options:
      no-debuginfo: true
    build-commands:
      - mv IPMIView_2.21.1_build.230720_bundleJRE_Linux_x64 /app/IPMIView
      - install -Dm755 IPMIView-starter /app/IPMIView
      - sed -i -e '/^lax.user.dir=/d' /app/IPMIView/IPMIView20.lax
      - echo 'lax.dir=/app/IPMIView/' >> /app/IPMIView/IPMIView20.lax
      - echo 'lax.root.install.dir=/app/IPMIView/' >> /app/IPMIView/IPMIView20.lax
      - |
        sed -i -r \
          -e 's/(disabledAlgorithms=.+?)MD5[^,]+?,/\1/g' \
          -e 's/TLSv1,//g' \
          -e 's/RSA keySize[^,]+,//g' \
          /app/IPMIView/jre/conf/security/java.security
      - install -Dm644 "${FLATPAK_ID}.desktop" -t /app/share/applications
      - install -Dm644 "${FLATPAK_ID}.metainfo.xml" -t /app/share/metainfo
      - install -Dm644 "${FLATPAK_ID}.png" "/app/share/icons/hicolor/48x48/apps/${FLATPAK_ID}.png"
    sources:
      - type: archive
        url: https://www.supermicro.com/Bios/sw_download/588/IPMIView_2.21.1_build.230720_bundleJRE_Linux_x64.tar.gz
        sha256: aaba66912ba3664341a72f4730be67608f4c9d7b6745fd4bc6fb003cfabbf103
        strip-components: 0
      - type: file
        path: com.supermicro.IPMIView.desktop
      - type: file
        path: com.supermicro.IPMIView.metainfo.xml
      - type: file
        path: com.supermicro.IPMIView.png
      - type: file
        path: IPMIView-starter
